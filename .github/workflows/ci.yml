name: CI

on:
  # Solo main en push: una rama fix/** con PR abierto disparaba DOS corridas
  # del mismo SHA (evento push + evento pull_request). La que perdia quedaba
  # CANCELLED y ese check cancelado dejaba el PR en UNSTABLE aunque la otra
  # corrida terminase verde. Para lanzar CI en una rama sin PR: workflow_dispatch.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v4

    # El oraculo de paridad es sys.executable. Debe ser el CPython de Ubuntu
    # 24.04 (/usr/bin/python3, 3.12.3), el mismo del entorno local y del job
    # de autopiton. El Python de setup-python (3.12.16) es otra build: carga
    # math como .so (su repr incluye la ruta, cambia vars()) y tiene mensajes
    # de error de random.sample(counts=...) distintos. Con el, la CI media un
    # oraculo distinto del que se usa para declarar paridad.
    - name: CPython oracle = Python del sistema de Ubuntu 24.04
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-venv
        /usr/bin/python3 -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"
        /usr/bin/python3 -m venv "$RUNNER_TEMP/oracle-venv"
        echo "$RUNNER_TEMP/oracle-venv/bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]

    - name: Run tests (Linux)
      run: |
        pi test tests/ -v --tb=short --ignore=tests/test_windows_validate.py

    - name: Verify CPython oracle
      run: |
        python -c "import sys; print(f'CPython {sys.version}')"
        python -c "from piton.native_differential import compare_native_to_cpython; print('Oracle OK')"

  test-windows:
    runs-on: windows-latest
    # Un compilador en bucle (o un binario nativo colgado) no debe quemar
    # seis horas de runner: el job tarda ~22 min en verde, 60 min es holgura.
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install NASM
      run: |
        choco install nasm -y

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]

    - name: Run tests (Windows)
      run: |
        pi test tests/ -v --tb=short --ignore=tests/test_windows_validate.py

    - name: Verify CPython oracle
      run: |
        python -c "import sys; print(f'CPython {sys.version}')"
        python -c "from piton.native_differential import compare_native_to_cpython; print('Oracle OK')"

  test-autopiton:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install sandbox and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]

    - name: Enable unprivileged user namespaces for bwrap
      run: |
        # Ubuntu 24.04 restringe los user namespaces sin privilegio por AppArmor,
        # y bwrap no puede crear su sandbox: el suite entero se saltaba y el gate
        # quedaba verde sin ejecutar ni un programa diferencial.
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        else
          echo "apparmor_restrict_unprivileged_userns no presente en este kernel"
        fi
        # La sonda es la del propio harness, no una replica de sus flags: un
        # probe a medida (p.ej. ejecutando /bin/true sin bind de /bin) da falso
        # negativo y one el log contra lo que despues mide `doctor`.
        python -c "from autopiton.sandbox import sandbox_available; print('sandbox disponible:', sandbox_available())"

    - name: AutoPiton doctor (sandbox provenance in the log)
      run: |
        python -m autopiton doctor

    - name: Verify CPython oracle baseline
      run: |
        /usr/bin/python3 -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"

    - name: Run AutoPiton anti-fake suite
      run: |
        python -m pytest autopiton/tests -q -rs

    - name: Run AutoPiton Frontier E differential suite (clean verification)
      run: |
        python -m autopiton compare --frontier e --count 25 --seed 101 --repeat 2
        python -m autopiton compare --frontier e --count 30 --seed 2026 --repeat 2

  verify-oracle:
    runs-on: ubuntu-latest
    needs: [test-linux, test-windows, test-autopiton]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]

    - name: Verify differential oracle
      run: |
        python -c "
        from piton.native_differential import compare_native_to_cpython
        result = compare_native_to_cpython('imprimir(\"Hola, mundo\")')
        assert result.equivalent, f'Oracle failed: {result}'
        print('Differential oracle: PASS')
        "

    - name: Verify dashboard
      run: |
        python -c "
        from piton.final_dashboard import build_dashboard, render_summary
        dashboard = build_dashboard()
        print(render_summary(dashboard))
        assert dashboard['release_ready'], 'Dashboard not ready'
        print('Dashboard: PASS')
        "
