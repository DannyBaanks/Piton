name: CI

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]

    - name: Run tests (Linux)
      run: |
        pi test tests/ -v --tb=short --ignore=tests/test_windows_validate.py

    - name: Verify CPython oracle
      run: |
        python -c "import sys; print(f'CPython {sys.version}')"
        python -c "from piton.native_differential import compare_native_to_cpython; print('Oracle OK')"

  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install NASM
      run: |
        choco install nasm -y

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]

    - name: Run tests (Windows)
      run: |
        pi test tests/ -v --tb=short --ignore=tests/test_windows_validate.py

    - name: Verify CPython oracle
      run: |
        python -c "import sys; print(f'CPython {sys.version}')"
        python -c "from piton.native_differential import compare_native_to_cpython; print('Oracle OK')"

  test-autopiton:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install sandbox and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]

    - name: Enable unprivileged user namespaces for bwrap
      run: |
        # Ubuntu 24.04 restringe los user namespaces sin privilegio por AppArmor,
        # y bwrap no puede crear su sandbox: el suite entero se saltaba y el gate
        # quedaba verde sin ejecutar ni un programa diferencial.
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        else
          echo "apparmor_restrict_unprivileged_userns no presente en este kernel"
        fi
        # La sonda es la del propio harness, no una replica de sus flags: un
        # probe a medida (p.ej. ejecutando /bin/true sin bind de /bin) da falso
        # negativo y one el log contra lo que despues mide `doctor`.
        python -c "from autopiton.sandbox import sandbox_available; print('sandbox disponible:', sandbox_available())"

    - name: AutoPiton doctor (sandbox provenance in the log)
      run: |
        python -m autopiton doctor

    - name: Verify CPython oracle baseline
      run: |
        /usr/bin/python3 -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"

    - name: Run AutoPiton anti-fake suite
      run: |
        python -m pytest autopiton/tests -q -rs

  verify-oracle:
    runs-on: ubuntu-latest
    needs: [test-linux, test-windows, test-autopiton]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]

    - name: Verify differential oracle
      run: |
        python -c "
        from piton.native_differential import compare_native_to_cpython
        result = compare_native_to_cpython('imprimir(\"Hola, mundo\")')
        assert result.equivalent, f'Oracle failed: {result}'
        print('Differential oracle: PASS')
        "

    - name: Verify dashboard
      run: |
        python -c "
        from piton.final_dashboard import build_dashboard, render_summary
        dashboard = build_dashboard()
        print(render_summary(dashboard))
        assert dashboard['release_ready'], 'Dashboard not ready'
        print('Dashboard: PASS')
        "
